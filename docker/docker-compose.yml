# =============================================================================
# Docker Compose конфигурация для OpenVPN LogServer.
# =============================================================================
# Сервисы:
# - mysql: База данных MySQL 8.0
# - openvpn-server: Сервер OpenVPN с генерацией PKI
# - openvpn-client: Клиент OpenVPN для тестирования
# - web: FastAPI приложение
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: openvpn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openvpn_logs}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    # MySQL не публикуется наружу — общается с приложением только по внутренней сети.
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - openvpn-network
    healthcheck:
      # Проверяем mysqld через файл с паролем (не через -p$VAR — иначе виден в ps).
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --defaults-extra-file=<(printf '[client]\\npassword=%s\\n' \"$$MYSQL_ROOT_PASSWORD\")"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  openvpn-server:
    build:
      context: ../
      dockerfile: docker/openvpn-server/Dockerfile
    container_name: openvpn-server
    restart: unless-stopped
    # Минимально необходимые capabilities вместо privileged.
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "11940:1194/udp"
    volumes:
      - openvpn_pki:/etc/openvpn/pki
      - openvpn_ccd:/etc/openvpn/ccd
      - openvpn_certs:/etc/openvpn/certs
      - type: tmpfs
        target: /run/openvpn
    networks:
      - openvpn-network
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-openvpn_logs}
      - OPENVPN_DIR=/etc/openvpn
      - CERTS_DIR=/etc/openvpn/certs
      - CRL_FILE=/etc/openvpn/pki/crl.pem
      - CCD_DIR=/etc/openvpn/ccd
      - OPENVPN_MGMT_SOCKET=/run/openvpn/mgmt.sock
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "openvpn --version 2>&1 | grep -q . && [ -S /run/openvpn/mgmt.sock ] || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  openvpn-client:
    build:
      context: ../
      dockerfile: docker/openvpn-client/Dockerfile
    container_name: openvpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      - openvpn-network
    environment:
      - OPENVPN_SERVER=openvpn-server
      - OPENVPN_PORT=1194
    depends_on:
      - openvpn-server
    profiles:
      - client
    command: ["sleep", "infinity"]

  web:
    build:
      context: ../
      dockerfile: docker/web/Dockerfile
    container_name: openvpn-web
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-openvpn_logs}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE:-openvpn_logs}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - WEB_AUTH_USERNAME=${WEB_AUTH_USERNAME:-admin}
      - WEB_AUTH_PASSWORD_HASH=${WEB_AUTH_PASSWORD_HASH:?WEB_AUTH_PASSWORD_HASH is required}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    networks:
      - openvpn-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
    driver: local
  openvpn_pki:
    driver: local
  openvpn_ccd:
    driver: local
  openvpn_certs:
    driver: local

networks:
  openvpn-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
