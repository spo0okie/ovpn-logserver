# =============================================================================
# OpenVPN Client Configuration
# =============================================================================
# Базовая конфигурация клиента OpenVPN
# =============================================================================

client
dev tun
proto udp

# Адрес сервера (будет переопределен через переменные окружения)
remote openvpn-server 1194

# Повторять попытку разрешения имени бесконечно
resolv-retry infinite

# Не привязываться к конкретному порту
nobind

# Сохранять ключи и туннель при перезапуске
persist-key
persist-tun

# -----------------------------------------------------------------------------
# Настройки безопасности
# -----------------------------------------------------------------------------

# Проверять что сервер имеет правильный сертификат
remote-cert-tls server

# Шифрование (должно совпадать с сервером)
cipher AES-256-GCM
auth SHA512

# -----------------------------------------------------------------------------
# Настройки логирования
# -----------------------------------------------------------------------------

# Уровень логирования
verb 3

# Лог файл
log-append /var/log/openvpn/client.log

# -----------------------------------------------------------------------------
# Пути к сертификатам (будут скопированы entrypoint скриптом)
# -----------------------------------------------------------------------------

ca /etc/openvpn/client/ca.crt
cert /etc/openvpn/client/client.crt
key /etc/openvpn/client/client.key

# TLS авторизация
key-direction 1
tls-auth /etc/openvpn/client/ta.key 1
