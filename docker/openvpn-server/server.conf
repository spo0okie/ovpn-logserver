# =============================================================================
# OpenVPN Server Configuration
# =============================================================================
# Конфигурация сервера OpenVPN для Docker окружения
#
# Ключевые изменения:
# - Management Interface: /run/openvpn/mgmt.sock (стандартный путь)
# - dev tun (без номера) для автоматического создания устройства
# - Все пути к файлам соответствуют структуре контейнера
# =============================================================================

# -----------------------------------------------------------------------------
# OpenVPN Management Interface
# -----------------------------------------------------------------------------
# Позволяет внешним процессам получать информацию о подключенных клиентах
# Используется collector/session_cleanup.py для обнаружения orphaned сессий
# collector/mgmt_client.py подключается к этому сокету
management /run/openvpn/mgmt.sock unix

# -----------------------------------------------------------------------------
# Основные настройки
# -----------------------------------------------------------------------------

# Порт и протокол
port 1194
proto udp

# Тип устройства (tun для routed VPN)
# Без номера - OpenVPN автоматически создаст tun0 или следующий доступный
dev tun

# -----------------------------------------------------------------------------
# Настройки сертификатов
# -----------------------------------------------------------------------------

# CA сертификат
ca /etc/openvpn/ca.crt

# Сертификат сервера
cert /etc/openvpn/server.crt

# Приватный ключ сервера
key /etc/openvpn/server.key

# ECDH параметры не требуются с ECDSA сертификатами
# ECDH используется автоматически с ECDSA ключами (prime256v1)
# ecdh /etc/openvpn/ecdh.pem

# DH файл не требуется с ECDSA сертификатами (используем ECDH)
dh none

# CRL файл для отозванных сертификатов
crl-verify /etc/openvpn/crl.pem

# -----------------------------------------------------------------------------
# Настройки сети
# -----------------------------------------------------------------------------

# VPN подсеть (сервер выдает адреса из этой сети клиентам)
server 10.8.0.0 255.255.255.0

# Маршрут для VPN сети
route 10.8.0.0 255.255.255.0

# CCD директория для клиентских настроек
client-config-dir /etc/openvpn/ccd

# client-to-client намеренно выключен — это лог-сервер OpenVPN, клиенты VPN
# не должны видеть друг друга через этот сервер.

# -----------------------------------------------------------------------------
# Настройки безопасности
# -----------------------------------------------------------------------------

# TLS авторизация - защита от DoS и флуда
tls-auth /etc/openvpn/ta.key 0
tls-server

# Шифрование - AES-256-GCM (современный AEAD шифр)
cipher AES-256-GCM
auth SHA512

# Минимальная TLS версия
tls-version-min 1.2

# -----------------------------------------------------------------------------
# Настройки логирования
# -----------------------------------------------------------------------------

# Уровень логирования (3 = детальный, 4 = отладочный)
verb 3

# Лог в stdout для отладки
# log-append /var/log/openvpn/openvpn.log

# Статус файл (обновляется каждые 10 секунд по умолчанию)
# status /var/log/openvpn/openvpn-status.log 10

# -----------------------------------------------------------------------------
# Скрипты подключения/отключения (Интеграция с LogServer)
# -----------------------------------------------------------------------------

# ОБЯЗАТЕЛЬНО для client-connect/client-disconnect: без script-security 2
# OpenVPN 2.6 отказывается исполнять внешние скрипты, и хуки не отрабатывают
# (запись сессий в БД не происходит вовсе).
script-security 2

# Скрипт при подключении клиента
# I9.4: При подключении создается запись в БД
client-connect /app/collector/client_connect.py

# Скрипт при отключении клиента
# I9.5: При отключении сессия закрывается
client-disconnect /app/collector/client_disconnect.py

# Пути для collector-скриптов приходят из окружения контейнера
# (docker-compose -> environment), как и DATABASE_URL. Директивы setenv-safe
# здесь не используются намеренно: setenv-safe добавляет к имени префикс
# OPENVPN_ (setenv-safe CERTS_DIR → OPENVPN_CERTS_DIR), поэтому скрипты,
# читающие CERTS_DIR/CRL_FILE/CCD_DIR, этих значений всё равно не увидели бы.

# -----------------------------------------------------------------------------
# Настройки keepalive и таймаутов
# -----------------------------------------------------------------------------

# Keepalive: ping каждые 10 секунд, считаем dead после 120 секунд
keepalive 10 120

# Таймаут неактивности - 7 дней (604800 секунд)
inactive 604800

# -----------------------------------------------------------------------------
# Настройки привилегий
# -----------------------------------------------------------------------------

# Понижаем привилегии после старта (user/group nobody должны существовать)
# В Alpine они обычно есть, но если нет - OpenVPN продолжит работу
# user nobody
# group nobody

# Сохраняем привилегии для выполнения скриптов подключения/отключения
# Эти директивы позволяют перечитать ключи без потери соединения
persist-key
persist-tun

# -----------------------------------------------------------------------------
# Настройки буферов
# -----------------------------------------------------------------------------

# Размеры буферов для повышения производительности
sndbuf 393216
rcvbuf 393216
push "sndbuf 393216"
push "rcvbuf 393216"

# -----------------------------------------------------------------------------
# Дополнительные настройки
# -----------------------------------------------------------------------------

# Максимальное количество клиентов
max-clients 100

# Не перечитывать ключи при получении SIGUSR1
persist-key

# Не закрывать и переоткрывать TUN/TAP устройство при SIGHUP
persist-tun

# Рабочая директория
cd /etc/openvpn
