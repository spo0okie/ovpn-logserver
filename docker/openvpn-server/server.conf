# =============================================================================
# OpenVPN Server Configuration
# =============================================================================
# Конфигурация сервера OpenVPN для Docker окружения
# =============================================================================

# -----------------------------------------------------------------------------
# Основные настройки
# -----------------------------------------------------------------------------

# Порт и протокол
port 1194
proto udp

# Тип устройства (tun для routed VPN)
dev tun

# -----------------------------------------------------------------------------
# Настройки сертификатов
# -----------------------------------------------------------------------------

# CA сертификат
ca /etc/openvpn/pki/ca.crt

# Сертификат сервера
cert /etc/openvpn/pki/issued/server.crt

# Приватный ключ сервера
key /etc/openvpn/pki/private/server.key

# DH параметры
dh /etc/openvpn/pki/dh.pem

# CRL файл для отозванных сертификатов
crl-verify /etc/openvpn/pki/crl.pem

# -----------------------------------------------------------------------------
# Настройки сети
# -----------------------------------------------------------------------------

# VPN подсеть (будет переопределена через командную строку)
# server 10.8.0.0 255.255.255.0

# Маршрут для VPN сети
route 10.8.0.0 255.255.255.0

# CCD директория для клиентских настроек
client-config-dir /etc/openvpn/ccd

# Разрешаем клиенты взаимодействовать между собой
client-to-client

# -----------------------------------------------------------------------------
# Настройки безопасности
# -----------------------------------------------------------------------------

# TLS авторизация
tls-auth /etc/openvpn/ta.key 0
tls-server

# Шифрование
cipher AES-256-GCM
auth SHA512

# TLS версия
tls-version-min 1.2

# -----------------------------------------------------------------------------
# Настройки логирования
# -----------------------------------------------------------------------------

# Уровень логирования (3 = детальный)
verb 3

# Лог файл
log-append /var/log/openvpn/openvpn.log

# Статус файл
status /var/log/openvpn/openvpn-status.log

# -----------------------------------------------------------------------------
# Скрипты подключения/отключения (Интеграция с LogServer)
# -----------------------------------------------------------------------------

# Скрипт при подключении клиента
# I9.4: При подключении создается запись в БД
client-connect /app/collector/client_connect.py

# Скрипт при отключении клиента
# I9.5: При отключении сессия закрывается
client-disconnect /app/collector/client_disconnect.py

# Переменные окружения для скриптов
setenv-safe DATABASE_URL "mysql+pymysql://openvpn:openvpn_password@mysql:3306/openvpn_logs"
setenv-safe OPENVPN_DIR "/etc/openvpn"
setenv-safe CERTS_DIR "/etc/openvpn/certs"
setenv-safe CRL_FILE "/etc/openvpn/pki/crl.pem"
setenv-safe CCD_DIR "/etc/openvpn/ccd"

# -----------------------------------------------------------------------------
# Настройки keepalive и таймаутов
# -----------------------------------------------------------------------------

# Keepalive: ping каждые 10 секунд, считаем dead после 120 секунд
keepalive 10 120

# Таймаут неактивности
inactive 604800

# -----------------------------------------------------------------------------
# Настройки привилегий
# -----------------------------------------------------------------------------

# Понижаем привилегии после старта (не работает в некоторых контейнерах)
# user nobody
# group nobody

# Сохраняем привилегии для выполнения скриптов
persist-key
persist-tun

# -----------------------------------------------------------------------------
# Настройки буферов
# -----------------------------------------------------------------------------

sndbuf 393216
rcvbuf 393216
push "sndbuf 393216"
push "rcvbuf 393216"

# -----------------------------------------------------------------------------
# Дополнительные настройки
# -----------------------------------------------------------------------------

# Максимальное количество клиентов
max-clients 100

# Не перечитывать ключи при получении SIGUSR1
persist-key

# Не закрывать и переоткрывать TUN/TAP устройство
persist-tun

# Рабочая директория
cd /etc/openvpn
