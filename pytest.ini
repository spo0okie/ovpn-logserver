[pytest]
# Юнит-тесты по умолчанию: SQLite, Docker не нужен.
# database/tests требуют живого MySQL, tests/e2e и docker/tests — Docker,
# поэтому из сборки по умолчанию исключены. Запускать их явно:
#   pytest database/tests      (нужен MySQL)
#   pytest tests/e2e           (нужен Docker)
#   pytest docker/tests        (нужен поднятый docker-compose стенд)
testpaths = collector/tests web/tests core/tests tests/integration

norecursedirs = .git .venv venv node_modules docker/tests tests/e2e database/tests

markers =
    integration: интеграционные тесты (SQLite, без Docker)
    e2e: end-to-end тесты, требуют Docker
    slow: длительные тесты

filterwarnings =
    ignore::DeprecationWarning:passlib.*
