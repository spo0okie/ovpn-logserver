{% extends "base.html" %}

{% block title %}Sessions - OpenVPN LogServer{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-diagram-3"></i> Sessions</h1>
    <div>
        <a href="/sessions?status=active" class="btn btn-success">
            <i class="bi bi-broadcast"></i> Active Only
        </a>
        <a href="/sessions" class="btn btn-outline-secondary">
            <i class="bi bi-list"></i> All
        </a>
    </div>
</div>

<!-- Фильтры -->
<div class="card mb-4">
    <div class="card-body">
        <form method="get" action="/sessions" class="row g-3" id="filterForm">
            <div class="col-md-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" name="account" 
                           placeholder="Account CN..." value="{{ account or '' }}">
                </div>
            </div>
            <div class="col-md-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-globe"></i></span>
                    <input type="text" class="form-control" name="source_ip" 
                           placeholder="Source IP..." value="{{ source_ip or '' }}">
                </div>
            </div>
            <div class="col-md-2">
                <select class="form-select" name="status">
                    <option value="">All Statuses</option>
                    <option value="active" {% if status == 'active' %}selected{% endif %}>Active</option>
                    <option value="closed" {% if status == 'closed' %}selected{% endif %}>Closed</option>
                </select>
            </div>
            <div class="col-md-2">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-geo"></i></span>
                    <input type="text" class="form-control" name="country" 
                           placeholder="Country..." value="{{ country or '' }}">
                </div>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-funnel"></i> Filter
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Таблица сессий (управляется DataTables) -->
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover" id="sessionsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Account</th>
                        <th>Connected</th>
                        <th>Duration</th>
                        <th>Source IP</th>
                        <th>Location</th>
                        <th>Virtual IP</th>
                        <th>Status</th>
                        <th>Traffic</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- DataTables заполнит tbody через AJAX -->
                </tbody>
            </table>
        </div>
        
        <!-- Пагинация управляется DataTables -->
        <div id="paginationContainer"></div>
        
        <!-- Информация о количестве записей -->
        <div class="text-center text-muted">
            <small id="recordsInfo">Loading...</small>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    console.log('[Sessions] Script starting...');
    console.log('[Sessions] jQuery version:', typeof $ !== 'undefined' ? $.fn.jquery : 'NOT LOADED');
    console.log('[Sessions] DataTables available:', typeof $.fn.DataTable !== 'undefined');
    
    $(document).ready(function() {
        console.log('[Sessions] Document ready, initializing DataTables...');
        
        // Проверяем наличие jQuery и DataTables
        if (typeof $ === 'undefined') {
            console.error('[Sessions] jQuery NOT LOADED!');
            return;
        }
        if (typeof $.fn.DataTable === 'undefined') {
            console.error('[Sessions] DataTables NOT LOADED!');
            return;
        }
        
        // Получаем параметры фильтров из URL
        var urlParams = new URLSearchParams(window.location.search);
        var initialAccount = urlParams.get('account') || '';
        var initialSourceIp = urlParams.get('source_ip') || '';
        var initialStatus = urlParams.get('status') || '';
        var initialCountry = urlParams.get('country') || '';
        
        console.log('[Sessions] Initial filters:', {
            account: initialAccount,
            source_ip: initialSourceIp,
            status: initialStatus,
            country: initialCountry
        });
        
        // Инициализируем DataTables с серверной обработкой
        var table = $('#sessionsTable').DataTable({
            processing: true,
            serverSide: true,
            pageLength: 20,
            lengthChange: true,
            lengthMenu: [[10, 20, 50, 100], [10, 20, 50, 100]],
            ajax: function(data, callback, settings) {
                console.log('[Sessions] DataTables requesting data:', data);
                
                // Преобразуем параметры DataTables в параметры API
                var page = Math.floor(data.start / data.length) + 1;
                var per_page = data.length;
                
                var params = {
                    page: page,
                    per_page: per_page,
                    account: initialAccount,
                    source_ip: initialSourceIp,
                    status: initialStatus,
                    country: initialCountry
                };
                
                // Параметры сортировки
                if (data.order && data.order.length > 0) {
                    params.order_col = data.order[0].column;
                    params.order_dir = data.order[0].dir;
                }
                
                console.log('[Sessions] Sending request with params:', params);
                
                $.ajax({
                    url: '/api/v1/sessions',
                    type: 'GET',
                    xhrFields: { withCredentials: true },
                    data: params,
                    dataType: 'json',
                    success: function(json) {
                        console.log('[Sessions] API response:', json);
                        
                        // Преобразуем ответ API в формат DataTables
                        var response = {
                            draw: data.draw,
                            recordsTotal: json.meta.total,
                            recordsFiltered: json.meta.total,
                            data: json.data || []
                        };
                        
                        console.log('[Sessions] Transformed response:', response);
                        callback(response);
                    },
                    error: function(xhr, error, thrown) {
                        console.error('[Sessions] AJAX error:', error, thrown, xhr.status, xhr.responseText);
                        if (xhr.status === 401) {
                            window.location.href = '/login';
                        }
                    }
                });
            },
            columns: [
                { data: 'id', name: 'id', orderable: true },
                { data: 'account_cn', name: 'account', orderable: true },
                { data: 'connected_at', name: 'connected', orderable: true },
                { data: 'duration_seconds', name: 'duration', orderable: false },
                { data: 'source_ip', name: 'source_ip', orderable: true },
                { data: 'geo.country', name: 'location', orderable: true, render: function(data, type, row) {
                    var country = row.geo && row.geo.country ? row.geo.country : '';
                    var city = row.geo && row.geo.city ? row.geo.city : '';
                    if (country && city) {
                        return country + ', ' + city;
                    }
                    return country || city || '-';
                }},
                { data: 'virtual_ip', name: 'virtual_ip', orderable: true },
                { data: 'status', name: 'status', orderable: true, render: function(data, type, row) {
                    if (data === 'active') {
                        return '<span class="badge badge-active">Active</span>';
                    } else {
                        return '<span class="badge badge-closed">Closed</span>';
                    }
                }},
                { data: 'bytes_sent', name: 'traffic', orderable: false, render: function(data, type, row) {
                    var sent = (data / 1024 / 1024).toFixed(2);
                    var received = (row.bytes_received / 1024 / 1024).toFixed(2);
                    return '<small><span class="text-success"><i class="bi bi-arrow-up"></i> ' + sent + ' MB</span><br><span class="text-info"><i class="bi bi-arrow-down"></i> ' + received + ' MB</span></small>';
                }}
            ],
            order: [[2, 'desc']],
            language: {
                search: 'Search:',
                lengthMenu: 'Show _MENU_ entries',
                info: 'Showing _START_ to _END_ of _TOTAL_ sessions',
                infoEmpty: 'No sessions available',
                infoFiltered: '(filtered from _MAX_ total sessions)',
                paginate: {
                    first: 'First',
                    previous: 'Previous',
                    next: 'Next',
                    last: 'Last'
                }
            },
            dom: '<"row"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6"f>><"row"<"col-sm-12"tr>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>'
        });

        // Обработчик кнопки фильтрации формы
        $('#filterForm').on('submit', function(e) {
            e.preventDefault();
            console.log('[Sessions] Filter form submitted');
            initialAccount = $('input[name="account"]').val();
            initialSourceIp = $('input[name="source_ip"]').val();
            initialStatus = $('select[name="status"]').val();
            initialCountry = $('input[name="country"]').val();
            console.log('[Sessions] New filters:', {
                account: initialAccount,
                source_ip: initialSourceIp,
                status: initialStatus,
                country: initialCountry
            });
            table.page(0).draw();
        });
    });
</script>
{% endblock %}
